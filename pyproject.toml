[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-perceiver"
version = "1.0.0"
description = "AgriPerceiver VLM: A Perceiver-based Vision-Language Model for Agricultural Pathology Diagnosis"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AgriPerceiver Team"},
]
keywords = ["vlm", "agriculture", "perceiver", "plant-pathology", "vision-language-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0,<3.0",
    "torchvision>=0.16.0,<1.0",
    "transformers>=4.40.0,<6.0",
    "accelerate>=0.28.0,<2.0",
    "peft>=0.10.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0,<3.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
eval = [
    "bert-score>=0.3.13",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
]
train = [
    "wandb>=0.16.0",
    "bitsandbytes>=0.41.0",
]
serve = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
agri-predict = "agri_perceiver.inference.predictor:main"
agri-eval = "agri_perceiver.evaluation.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
