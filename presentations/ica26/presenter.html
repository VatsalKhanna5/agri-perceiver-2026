<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter · AgriPerceiver</title>
<link rel="icon" href="assets/figures/21.svg">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  :root {
    --field: #f7d74e; --field-deep: #e9c63d;
    --paper: #fdfcf6; --paper-sunk: #f7f4e8; --paper-edge: #f1ecdb;
    --ink: #14120c; --ink-2: #423c2c; --ink-3: #57503f; --ink-4: #655e4b;
    --leaf: #2c8150; --leaf-deep: #1f5e3a; --rust: #b54a3e;
    --rule: color-mix(in oklab, var(--ink) 16%, transparent);
    --rule-soft: color-mix(in oklab, var(--ink) 8%, transparent);
    --display: "Cormorant Garamond", Georgia, serif;
    --serif: "Newsreader", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper-sunk); color: var(--ink); font-family: var(--serif); font-variant-numeric: lining-nums; }
  .label { font: 400 11.5px/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  button {
    appearance: none; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; box-shadow: 2px 2px 0 var(--ink); transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--ink); color: var(--field); }
  button.on { background: var(--field); }

  /* ── Live view ─────────────────────────────────────────────────────── */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  .bar {
    display: flex; align-items: center; gap: 22px; padding: 12px 22px;
    background: var(--field); border-bottom: 1.5px solid var(--ink);
  }
  .bar .brand { font: 600 22px/1 var(--display); }
  .bar .where { display: flex; flex-direction: column; gap: 4px; min-width: 260px; }
  .bar .where b { font: 600 20px/1.1 var(--display); }
  .clock { display: flex; align-items: baseline; gap: 14px; margin-left: auto; }
  .clock .t { font: 500 44px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .clock .rem { font: 15px/1 var(--mono); color: var(--ink-2); }
  .pace { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--ink); background: var(--paper); }
  .pace.ahead, .pace.ok { color: var(--leaf-deep); border-color: var(--leaf-deep); }
  .pace.behind { color: var(--paper); background: var(--rust); border-color: var(--rust); }
  .bar .ctl { display: flex; gap: 8px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 22px; padding: 18px 22px; min-height: 0; }
  .under { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .tabs { display: flex; gap: 8px; align-items: center; flex: none; }
  .tabs button.on { background: var(--ink); color: var(--field); }
  .tabs .hint { margin-left: auto; }
  .panel { flex: 1; min-height: 0; display: none; }
  .panel.on { display: block; }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1.5px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--field); box-shadow: 4px 4px 0 var(--ink); flex: none; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .frame.now { outline: 3px solid var(--leaf); outline-offset: 3px; }
  .frame .tag { position: absolute; left: 10px; top: 10px; z-index: 2; background: var(--ink); color: var(--field); padding: 4px 9px; border-radius: 6px; font: 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }

  .notes { height: 100%; overflow-y: auto; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; padding: 22px 26px 26px; }
  .notes .anchor { font: italic 500 clamp(26px, 1.7vw, 36px)/1.15 var(--display); color: var(--leaf-deep); margin: 6px 0 18px; padding-left: 14px; border-left: 3px solid var(--leaf); }
  .notes .say p { font-size: clamp(19px, 1.2vw, 25px); line-height: 1.55; margin: 0 0 14px; color: var(--ink-2); }
  .notes .say strong { color: var(--ink); font-weight: 600; background: linear-gradient(transparent 62%, color-mix(in oklab, var(--field) 70%, transparent) 62%); }
  .notes .say .click { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; color: var(--paper); background: var(--leaf); padding: 3px 7px; border-radius: 5px; margin-right: 6px; vertical-align: 2px; }
  .cues { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
  .cues li { font: 13.5px/1.4 var(--mono); color: var(--ink-3); padding-left: 16px; position: relative; }
  .cues li::before { content: ""; position: absolute; left: 0; top: 6px; width: 7px; height: 7px; rotate: 45deg; background: var(--ink-3); }

  .side-next .label { display: block; margin-bottom: 8px; }
  .next-title { font: 600 20px/1.15 var(--display); margin: 8px 0 0; }
  .slide-time { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .slide-time .row { display: flex; flex-direction: column; gap: 8px; }
  .slide-time .row b { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { height: 8px; border-radius: 999px; background: var(--rule-soft); margin-top: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--leaf); border-radius: 999px; transition: width 0.4s linear, background 0.3s; }
  .meter i.over { background: var(--rust); }
  .map { display: flex; gap: 3px; margin-top: 12px; }
  .map span { flex: var(--t); height: 6px; border-radius: 3px; background: var(--rule); cursor: pointer; }
  .map span.done { background: var(--ink-3); }
  .map span.now { background: var(--ink); height: 10px; margin-top: -2px; }

  .qa { height: 100%; overflow-y: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; }
  .qa details { border-bottom: 1px solid var(--rule-soft); padding: 9px 0; }
  .qa summary { cursor: pointer; font-size: 19px; line-height: 1.35; color: var(--ink); list-style: none; padding-left: 18px; position: relative; }
  .qa summary::before { content: "Q"; position: absolute; left: 0; font: 500 12px/1.6 var(--mono); color: var(--rust); }
  .qa details p { margin: 8px 0 4px 18px; font-size: 18px; line-height: 1.5; color: var(--ink-2); }
  .status { font: 11px/1.4 var(--mono); color: var(--ink-4); letter-spacing: 0.04em; margin: 12px 0 0; }
  .status.live { color: var(--leaf-deep); }

  /* ── Script (printable) ────────────────────────────────────────────── */
  body.script { overflow: auto; background: var(--paper); }
  .script-doc { max-width: 860px; margin: 0 auto; padding: 56px 40px 80px; }
  .script-doc h1 { font: 600 54px/1 var(--display); margin: 8px 0 6px; letter-spacing: -0.02em; }
  .script-doc .sub { font-size: 19px; color: var(--ink-2); margin: 0 0 30px; }
  .script-doc .sl { border-top: 1.5px solid var(--ink); padding: 18px 0 8px; break-inside: avoid; }
  .script-doc .sl header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  .script-doc .sl h2 { font: 600 28px/1.1 var(--display); margin: 0; }
  .script-doc .sl .anchor { font: italic 500 21px/1.3 var(--display); color: var(--leaf-deep); margin: 10px 0; }
  .script-doc .sl p { font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; color: var(--ink-2); }
  .script-doc .sl p strong { color: var(--ink); }
  .script-doc .sl .cues li { font-size: 12px; }
  .script-doc .qa-doc { margin-top: 30px; border-top: 1.5px solid var(--ink); padding-top: 18px; }
  .script-doc .qa-doc h2 { font: 600 34px/1 var(--display); margin: 0 0 16px; }
  .script-doc .qa-doc .q { font-weight: 600; font-size: 16.5px; margin: 14px 0 4px; break-after: avoid; }
  .script-doc .qa-doc .a { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); margin: 0; }
  .script-tools { position: fixed; right: 18px; top: 18px; display: flex; gap: 8px; }
  @page { size: A4; margin: 16mm 14mm; }
  @media print { .script-tools { display: none; } .script-doc { padding: 0; max-width: none; } body.script { background: #fff; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/js/notes.js"></script>
<script>
(function () {
  const N = window.NOTES, QA = window.QA;
  const mainIdx = N.filter((n) => !n.backup).length;
  const budget = 12 * 60;
  const cum = []; N.reduce((a, n, i) => ((cum[i] = a), a + n.t), 0);
  const mmss = (s) => { const neg = s < 0; s = Math.abs(Math.round(s)); return `${neg ? "−" : ""}${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  const md = (t) => t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^\[click\]\s*/, '<span class="click">CLICK →</span>');
  const root = document.getElementById("root");
  let titles = N.map((_, i) => `Slide ${i + 1}`);

  // Titles live on the slides themselves (data-title), so read them from there.
  const titlesReady = fetch("index.html").then((r) => r.text()).then((h) => {
    const d = new DOMParser().parseFromString(h, "text/html");
    titles = Array.from(d.querySelectorAll(".slide")).map((s, i) => s.dataset.title || `Slide ${i + 1}`);
  }).catch(() => {});

  /* ═══ SCRIPT MODE ═══════════════════════════════════════════════════ */
  if (new URLSearchParams(location.search).has("script")) {
    document.body.classList.add("script");
    titlesReady.then(() => {
      const total = N.filter((n) => !n.backup).reduce((a, n) => a + n.t, 0);
      root.innerHTML = `<div class="script-tools"><button onclick="print()">Print / Save PDF</button><button onclick="location.href='presenter.html'">Live view</button></div>
      <article class="script-doc">
        <span class="label">ICA 2026 · Paper 16 · Speaker script</span>
        <h1>AgriPerceiver</h1>
        <p class="sub">12 minutes + 3 minutes Q&amp;A. Target running time ${mmss(total)} across ${mainIdx} slides; <b>bold</b> = land this phrase; CLICK = advance the build.</p>
        ${N.map((n, i) => `<section class="sl">
          <header><h2>${n.backup ? "Backup" : String(i + 1).padStart(2, "0")} · ${titles[i]}</h2><span class="label">${n.backup ? "if asked" : `${mmss(n.t)} · at ${mmss(cum[i])}`}</span></header>
          <p class="anchor">${n.anchor}</p>
          <ul class="cues">${n.cue.map((c) => `<li>${c}</li>`).join("")}</ul>
          ${n.say.map((p) => `<p>${md(p)}</p>`).join("")}
        </section>`).join("")}
        <section class="qa-doc"><h2>Questions to expect</h2>
          ${QA.map((x) => `<p class="q">${x.q}</p><p class="a">${x.a}</p>`).join("")}
        </section>
      </article>`;
    });
    return;
  }

  /* ═══ LIVE MODE ═════════════════════════════════════════════════════ */
  root.innerHTML = `<div class="app">
    <header class="bar">
      <span class="brand">AgriPerceiver</span>
      <div class="where"><span class="label" id="pos">01 / 15</span><b id="ttl"></b></div>
      <span class="label" id="build"></span>
      <div class="clock"><span class="pace ok" id="pace">ready</span><span class="t" id="clock">00:00</span><span class="rem" id="rem">12:00 left</span></div>
      <div class="ctl">
        <button class="primary" id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
        <button id="prevBtn">← Prev</button>
        <button id="nextBtn">Next →</button>
        <button id="scriptBtn">Script</button>
      </div>
    </header>
    <div class="main">
      <div class="col">
        <div class="frame now"><iframe id="cur" title="Current slide"></iframe></div>
        <div class="under">
          <div class="side-next">
            <span class="label">Up next</span>
            <div class="frame"><iframe id="nxt" title="Next slide"></iframe></div>
            <p class="next-title" id="nxtTitle"></p>
          </div>
          <div class="slide-time">
            <div class="row"><span class="label">On this slide</span><b id="onSlide">00:00 / 00:00</b></div>
            <div class="meter"><i id="meter"></i></div>
            <div class="map" id="map"></div>
            <p class="status" id="status">Waiting for the deck. Open index.html and press S, or drive from here.</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="tabs"><button class="on" id="tabNotes">Script</button><button id="tabQA">Q&amp;A prep</button><span class="label hint">Q toggles</span></div>
        <section class="panel on notes" id="notes"></section>
        <div class="panel qa" id="qa"><span class="label">Three minutes: two sentences, then stop</span>
          ${QA.map((x) => `<details><summary>${x.q}</summary><p>${x.a}</p></details>`).join("")}
        </div>
      </div>
    </div>
  </div>`;

  const $ = (id) => document.getElementById(id);
  const cur = $("cur"), nxt = $("nxt");
  cur.src = "index.html?preview#/1";
  nxt.src = "index.html?preview&static#/2";

  // Previews are 1920×1080 pages scaled into their frames.
  const ro = new ResizeObserver((es) => es.forEach((e) => {
    const f = e.target.querySelector("iframe");
    f.style.transform = `scale(${e.contentRect.width / 1920})`;
  }));
  document.querySelectorAll(".frame").forEach((f) => ro.observe(f));

  $("map").innerHTML = N.map((n, i) => (n.backup ? "" : `<span data-i="${i}" style="--t:${n.t}" title="${i + 1}"></span>`)).join("");

  let idx = -1, step = 0, steps = 0, total = N.length, live = false; // -1: nothing rendered yet
  let running = false, t0 = 0, acc = 0, slideT0 = performance.now(), slideAcc = 0;
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("agriperceiver-ica26") : null;

  const elapsed = () => acc + (running ? (performance.now() - t0) / 1000 : 0);
  const onSlide = () => slideAcc + (running ? (performance.now() - slideT0) / 1000 : 0);

  function stepsOf(i) {
    try { const D = cur.contentWindow.Deck; return Math.max(0, ...Array.from(D.slides[i].querySelectorAll("[data-step]")).map((e) => +e.dataset.step)); }
    catch { return 0; }
  }

  function render(changed) {
    const n = N[idx] || N[0];
    $("pos").textContent = n.backup ? "Backup" : `${String(idx + 1).padStart(2, "0")} / ${String(mainIdx).padStart(2, "0")}`;
    $("ttl").textContent = titles[idx];
    $("build").textContent = steps ? `Build ${step} / ${steps}` : "";
    const h = `#/${idx + 1}${step ? "/" + step : ""}`;
    if (cur.contentWindow && cur.contentWindow.location.hash !== h) cur.contentWindow.location.hash = h;
    const ni = Math.min(idx + 1, total - 1);
    const nh = step < steps ? `#/${idx + 1}` : `#/${ni + 1}`;
    if (nxt.contentWindow && nxt.contentWindow.location.hash !== nh) nxt.contentWindow.location.hash = nh;
    $("nxtTitle").textContent = step < steps ? `Build ${step + 1} of ${steps} on this slide` : idx === total - 1 ? "End of deck" : titles[ni];
    if (changed) {
      $("notes").innerHTML = `<span class="label">Speaker notes · target ${mmss(n.t)}</span>
        <p class="anchor">${n.anchor}</p>
        <ul class="cues">${n.cue.map((c) => `<li>${c}</li>`).join("")}</ul>
        <div class="say">${n.say.map((p) => `<p>${md(p)}</p>`).join("")}</div>`;
      $("notes").scrollTop = 0;
    }
    document.querySelectorAll("#map span").forEach((s) => {
      const i = +s.dataset.i;
      s.className = i < idx ? "done" : i === idx ? "now" : "";
    });
  }

  function setState(i, st, st_total) {
    const changed = i !== idx;
    if (changed) { slideAcc = 0; slideT0 = performance.now(); }
    idx = i; step = st; steps = st_total ?? stepsOf(i);
    render(changed);
  }

  function next() {
    if (!running && elapsed() === 0) start();
    if (live) return bc.postMessage({ type: "next" });
    steps = stepsOf(idx);
    if (step < steps) setState(idx, step + 1, steps);
    else if (idx < total - 1) setState(idx + 1, 0);
  }
  function prev() {
    if (live) return bc.postMessage({ type: "prev" });
    if (step > 0) setState(idx, step - 1, steps);
    else if (idx > 0) setState(idx - 1, stepsOf(idx - 1), stepsOf(idx - 1));
  }
  function goTo(i) {
    if (live) return bc.postMessage({ type: "go", idx: i, step: 0 });
    setState(i, 0);
  }

  function start() {
    if (running) { acc = elapsed(); slideAcc = onSlide(); running = false; $("startBtn").textContent = "Resume"; return; }
    running = true; t0 = performance.now(); slideT0 = performance.now(); $("startBtn").textContent = "Pause";
  }
  function reset() { running = false; acc = 0; slideAcc = 0; $("startBtn").textContent = "Start"; }

  function tick() {
    if (idx < 0) return requestAnimationFrame(tick);
    const e = elapsed(), s = onSlide(), n = N[idx];
    $("clock").textContent = mmss(e);
    $("rem").textContent = e <= budget ? `${mmss(budget - e)} left` : `${mmss(e - budget)} over`;
    $("onSlide").textContent = `${mmss(s)} / ${mmss(n.t)}`;
    const m = $("meter");
    m.style.width = `${Math.min(100, n.t ? (s / n.t) * 100 : 0)}%`;
    m.classList.toggle("over", n.t > 0 && s > n.t + 5);
    const p = $("pace");
    if (!running && e === 0) { p.className = "pace ok"; p.textContent = "ready"; }
    else if (n.backup || idx >= mainIdx) { p.className = "pace ok"; p.textContent = "Q&A"; }
    else {
      // Behind if the clock has passed the end of this slide's slot; ahead if it hasn't reached its start.
      const lo = cum[idx], hi = cum[idx] + n.t;
      if (e > hi + 10) { p.className = "pace behind"; p.textContent = `${mmss(e - hi)} behind`; }
      else if (e < lo - 10) { p.className = "pace ahead"; p.textContent = `${mmss(lo - e)} ahead`; }
      else { p.className = "pace ok"; p.textContent = "on pace"; }
    }
    requestAnimationFrame(tick);
  }

  if (bc) {
    bc.onmessage = ({ data }) => {
      if (data.type !== "state") return;
      if (!live) { live = true; $("status").textContent = "● Linked to the deck: keys here drive the audience screen."; $("status").className = "status live"; }
      total = data.total;
      setState(data.idx, data.step, data.steps);
    };
    bc.postMessage({ type: "hello" });
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (["ArrowRight", "ArrowDown", " ", "PageDown", "Enter", "n"].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace", "p"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "t" || e.key === "T") start();
    else if (e.key === "r" || e.key === "R") reset();
  });
  const tab = (qa) => {
    $("notes").classList.toggle("on", !qa); $("qa").classList.toggle("on", qa);
    $("tabNotes").classList.toggle("on", !qa); $("tabQA").classList.toggle("on", qa);
  };
  $("tabNotes").onclick = () => tab(false);
  $("tabQA").onclick = () => tab(true);
  document.addEventListener("keydown", (e) => { if (e.key === "q" || e.key === "Q") tab(!$("qa").classList.contains("on")); });
  $("startBtn").onclick = start;
  $("resetBtn").onclick = reset;
  $("prevBtn").onclick = prev;
  $("nextBtn").onclick = next;
  $("scriptBtn").onclick = () => window.open("presenter.html?script", "_blank");
  $("map").addEventListener("click", (e) => { const s = e.target.closest("span[data-i]"); if (s) goTo(+s.dataset.i); });

  const m = location.hash.match(/#\/(\d+)(?:\/(\d+))?/);
  titlesReady.then(() => {
    if (!live) setState(m ? +m[1] - 1 : 0, m ? +(m[2] || 0) : 0);
    else render(true);
  });
  cur.addEventListener("load", () => { if (idx >= 0) { steps = stepsOf(idx); render(false); } });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
